[project]
name = "info4000"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jalen Oglivie", email = "jmo30232@uga.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "flask>=3.1.3",
    "gymnasium[classic-control]>=1.3.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.4",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[project.scripts]
info4000 = "info4000:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "1stAssignment",
    "1exercise",
    "2ndexercise",
    "3rdexercise",
    "1stHW",
    "4thexercise",
    "5thexercise",
    "2ndHW",
    "7thexercise",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
