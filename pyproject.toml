[project]
name = "info4000"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jalen Oglivie", email = "jmo30232@uga.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "flask>=3.1.3",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "pypdf>=6.19.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[project.scripts]
info4000 = "info4000:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "1stAssignment",
    "1exercise",
    "2ndexercise",
    "3rdexercise",
    "1stHW",
    "4thexercise",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
