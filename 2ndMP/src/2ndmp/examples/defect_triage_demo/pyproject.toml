[project]
name = "defect-triage-demo"
version = "0.1.0"
description = "Defect report triage three ways: single agent, workflow, multi-agent (MCP + Ollama + Streamlit)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
    "ollama>=0.5.1",
    "streamlit>=1.40",
    "pandas",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
